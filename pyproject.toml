[project]
name = "obscure_stats"
version = "0.8.0"
description = "Collection of lesser-known statistical functions"
authors = [{ name = "Hleb Levitski" }]
requires-python = ">=3.12,<3.15"
readme = "README.md"
package = false
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0.0,<3",
    "scipy>=1.16.0,<2",
]

[project.license]
file = "LICENSE.txt"

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10",
    "pytest-cov>=7.0.0,<8",
    "ruff>=0.16.0,<0.17",
    "hypothesis>=6.103.1,<7",
    "hypothesis-pytest>=0.19.0,<0.20",
    "pyrefly>=1.0.0,<2",
]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = "src"

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]
ignore = ["COM812", "ISC001"]
task-tags = ["TODO"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["CPY001"]
"tests/*.py" = ["CPY001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-line-length = "dynamic"
docstring-code-format = false

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 88
max-line-length = 100

[tool.pyrefly]
project-includes = [
    "**/*.py*",
]
min-severity = "warn"
