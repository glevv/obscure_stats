name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PYTHONUNBUFFERED: "1"
  PYTHONHASHSEED: "1"
  PYTHONFAULTHANDLER: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  CI: "true"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: True
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run ruff
        run: |
          uv run ruff check . --output-format=github
          uv run ruff format . --diff

      - name: Run pyrefly
        run: |
          uv run pyrefly check . --output-format=github

      - name: Run tests
        run: |
          uv run pytest --cov=obscure_stats --cov-report term --cov-report xml:coverage.xml
          rm -f .coverage

      - name: Run Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          flag-name: run-${{ matrix.python-version }}
          git-commit: ${{ github.event.pull_request.head.sha || github.sha }}
          file: coverage.xml
          format: cobertura
          parallel: true

  aggregate-tests:
    needs: build
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Upload Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          carryforward: "run-3.12,run-3.13,run-3.14"
          parallel-finished: true
